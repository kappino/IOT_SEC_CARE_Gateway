# ==============================================================================
# Eclipse Mosquitto - Zero-Trust mTLS v1.2/v1.3 Configuration
# ==============================================================================

# Standard unencrypted listener disabled
# listener 1883

# Secure TLS Listener
listener 8883 0.0.0.0

# Protocol & TLS Hardening
protocol mqtt
tls_version tlsv1.3

# Certificate Authority (Private Root CA)
cafile /mosquitto/config/certs/ca-cert.pem

# Server Certificate & Private Key (with IP SAN binding)
certfile /mosquitto/config/certs/server-cert.pem
keyfile /mosquitto/config/certs/server-key.pem

# Force Mutual Authentication (mTLS)
require_certificate true

# Map Client Certificate Common Name (CN) directly to MQTT Username for ACL verification
use_identity_as_username true

# Disable Anonymous Access
allow_anonymous false

# Access Control List file
acl_file /mosquitto/config/mosquitto.acl

# Logging & Persistence
log_dest stdout
log_type all
persistence true
persistence_location /mosquitto/data/
